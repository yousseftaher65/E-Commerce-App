name: ecommerce_pojo
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.2
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  google_sign_in : ^6.2.2
  easy_localization: ^3.0.8
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.0.2
  fluttertoast : ^9.0.0
  loader_overlay: ^5.0.0
  animate_do: ^4.2.0
  animated_toggle_switch: ^0.8.7
  cached_network_image_ce: ^4.6.2
  carousel_slider: ^5.1.2
  flutter_svg: ^2.2.4
  shared_preferences: ^2.5.4
  get_it: ^9.2.1
  flutter_native_splash: ^2.4.7
  readmore: ^3.0.0
  smooth_page_indicator: ^2.0.1  
  dartz: ^0.10.1
  injectable: ^2.5.0
  pretty_dio_logger: ^1.4.0
  equatable: ^2.0.7
  flutter_gen: ^5.12.0
  go_router: ^17.1.0
  internet_connection_checker_plus: ^2.9.1+2
  provider:
  skeletonizer: ^2.1.3
  pay_with_paymob: ^1.4.0
  hydrated_bloc: ^10.1.1

flutter_gen:
  output: lib/core/utils/
  assets:
    enabled: true 
    exclude:
      - assets/translations/

flutter_native_splash:
  color: "#ffffff"
  image: "assets/logos/app_logo_splash_light.png"
  color_dark: "#1E1E1E"
  image_dark: "assets/logos/app_logo_splash_dark.png"

  android_12:
    image: "assets/logos/app_logo_splash_light.png"
    image_dark: "assets/logos/app_logo_splash_dark.png"
    color_dark: "#1E1E1E"
    color: "#ffffff"



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.12.2
  injectable_generator: ^2.12.1
  flutter_gen_runner: ^5.13.0 

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/images/
    - assets/icons/
    - assets/translations/
